services:
  inference-service:
    build: ./hf_space
    # Hub id/revision default from shared/release.json (copied to hf_space/release.json).
    # Set HF_MODEL_ID / HF_MODEL_REVISION only to override that pin.
    environment:
      HF_MODEL_ID: ${HF_MODEL_ID:-}
      HF_MODEL_REVISION: ${HF_MODEL_REVISION:-}
    ports:
      - "7860:7860"

  api-service:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      # Set HF_ENDPOINT_URL in .env to use a deployed Space / Inference Endpoint instead.
      HF_ENDPOINT_URL: ${HF_ENDPOINT_URL:-http://inference-service:7860/}
    ports:
      - "8000:8000"
    volumes:
      - ./api/data:/app/data:ro
    depends_on:
      - inference-service

  ui-service:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api-service

  # One container, one port — same process layout as Render. Does not start with
  # `docker compose up`; run: docker compose --profile all up --build cropcare
  cropcare:
    profiles: ["all"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      PORT: ${PORT:-3000}
      HF_ENDPOINT_URL: http://127.0.0.1:7860/
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
